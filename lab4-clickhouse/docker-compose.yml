services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: lab4-clickhouse
    environment:
      CLICKHOUSE_DB: monitoring
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: lab_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP (вставка, curl)
      - "9000:9000"   # native (Grafana, clickhouse-client)
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  generator:
    build: ./generator
    container_name: lab4-generator
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: lab_pass
      CLICKHOUSE_DB: monitoring
      BASE_RPS: 60          # средняя нагрузка, событий/сек
      BACKFILL_MINUTES: 60  # сколько истории залить при старте
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: lab4-grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  ch_data:
  grafana_data:
