global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: app
    static_configs: [{targets: ["app:8000"]}]
  - job_name: redis
    static_configs: [{targets: ["redis_exporter:9121"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres_exporter:9187"]}]
