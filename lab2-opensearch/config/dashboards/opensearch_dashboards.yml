server.host: "0.0.0.0"
server.name: "lab2-dashboards"

# HTTPS для самих Dashboards (браузер <-> Dashboards)
server.ssl.enabled: true
server.ssl.certificate: /usr/share/opensearch-dashboards/config/certs/dashboards.pem
server.ssl.key: /usr/share/opensearch-dashboards/config/certs/dashboards-key.pem

# Dashboards -> OpenSearch по TLS с проверкой сертификата
opensearch.hosts: ["https://os-hot1:9200"]
opensearch.ssl.verificationMode: full
opensearch.ssl.certificateAuthorities: ["/usr/share/opensearch-dashboards/config/certs/root-ca.pem"]

# Служебный пользователь Dashboards
opensearch.username: "kibanaserver"
opensearch.requestHeadersWhitelist: ["securitytenant", "Authorization"]

opensearch_security.multitenancy.enabled: false
opensearch_security.cookie.secure: true
