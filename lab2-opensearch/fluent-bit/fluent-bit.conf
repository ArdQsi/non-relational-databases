[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

# Читаем JSON-лог nginx, лежащий на общем томе
[INPUT]
    Name              tail
    Path              /var/log/nginx-json/access.log
    Tag               nginx.access
    Parser            nginx_json
    Read_from_Head    On
    Refresh_Interval  2
    DB                /fluent-bit/db/nginx-access.db

# Отправляем в data stream logs пользователем log_writer по HTTPS
[OUTPUT]
    Name                opensearch
    Match               nginx.*
    Host                os-hot1
    Port                9200
    HTTP_User           ${OS_WRITER_USER}
    HTTP_Passwd         ${OS_WRITER_PASSWORD}
    tls                 On
    tls.verify          On
    tls.ca_file         /fluent-bit/certs/root-ca.pem
    Index               logs
    Write_Operation     create
    Suppress_Type_Name  On
    Time_Key            @timestamp
    Replace_Dots        On
    Trace_Error         On
    Retry_Limit         10
