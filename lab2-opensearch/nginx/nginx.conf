user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Лог в формате JSON (одна строка = один JSON-объект).
    # escape=json экранирует спецсимволы в значениях, числа выводятся без кавычек.
    log_format json_logs escape=json
        '{'
          '"time_iso8601":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"remote_user":"$remote_user",'
          '"request_method":"$request_method",'
          '"request_uri":"$request_uri",'
          '"server_protocol":"$server_protocol",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"http_referer":"$http_referer",'
          '"http_user_agent":"$http_user_agent"'
        '}';

    # Отдельный каталог: в /var/log/nginx образ nginx кладёт симлинки access.log -> /dev/stdout,
    # а нам нужен настоящий файл, который читает Fluent Bit.
    access_log /var/log/nginx-json/access.log json_logs;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
